name: MLOps Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mlops-ci:
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install evidently mlflow

    - name: ✅ Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 🧪 Run Unit Tests
      run: |
        pytest tests/

    - name: 🧠 Train Model (quick test)
      run: |
        python src/train.py --test-mode  # add a flag to run quick CI version

    - name: 📊 Run Evidently Drift Report (if needed)
      run: |
        python src/generate_drift_report.py  # you write this to compare reference.csv and current.csv

    - name: 📤 Upload Drift Report Artifact
      uses: actions/upload-artifact@v3
      with:
        name: drift-report
        path: reports/data_drift.html
