name: MLOps Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------
  # STAGE 1: CI - Lint, test, (optional) train
  # -------------------
  validate-and-train:
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install evidently mlflow

    - name: ✅ Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: 🧪 Run Unit Tests
      run: |
        pytest tests/

    # - name: 🧠 Train Model (quick test)
    #   run: |
    #     python src/train.py --test-mode  # add a flag to run quick CI version

    - name: 📊 Run Evidently Drift Report (if needed)
      run: |
        python src/generate_drift_report.py  # you write this to compare reference.csv and current.csv

    - name: 📤 Upload Drift Report Artifact
      uses: actions/upload-artifact@v3
      with:
        name: drift-report
        path: reports/data_drift.html

     # -------------------
  # STAGE 2: CD - Release model on tag or manual
  # -------------------
  release-model:
    needs: [validate-and-train]
    runs-on: ubuntu-latest
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/model-v') || github.event_name == 'workflow_dispatch') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install MLflow
      run: |
        pip install mlflow torch torchvision

    - name: Download Trained Model
      uses: actions/download-artifact@v3
      with:
        name: trained-model
        path: outputs/

    - name: Register Model to MLflow
      run: |
        python scripts/register_model.py --path outputs/model.pth --name "MyImageClassifier"

    - name: Promote to Production (optional)
      run: |
        python scripts/promote_model.py --model-name "MyImageClassifier" --stage "Production"
