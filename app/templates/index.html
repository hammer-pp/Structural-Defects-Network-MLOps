<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concrete Crack Detector</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-4">Surface Crack Detector</h1>
        <p class="text-gray-600 text-center mb-6">Upload an image of decks/pavements/walls/user's surface to detect cracks.</p>

        <form action="/" method="post" enctype="multipart/form-data" class="flex flex-col items-center space-y-4">
            <input type="file" name="file" accept="image/*" required class="block text-sm text-gray-700 file:py-2 file:px-4 file:rounded file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Predict</button>
        </form>

        {% if result %}
        <div class="mt-8 flex flex-col items-center">
            <div class="mb-4 text-center">
                <h2 class="text-xl font-semibold text-gray-800">Prediction:</h2>
                <p class="text-lg text-blue-600 mt-1">{{ result }}</p>
            </div>
            <a href="/" class="mt-6 text-blue-600 hover:underline">Scan another image</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
