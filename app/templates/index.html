<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concrete Crack Detector</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-4">Surface Crack Detector</h1>
        <p class="text-gray-600 text-center mb-6">Upload an image of decks/pavements/walls/user's surface to detect
            cracks.</p>

        <form id="uploadForm" action="/" method="post" enctype="multipart/form-data" class="space-y-4 w-full">
            <div id="dropzone"
                class="flex items-center justify-center w-full px-4 py-10 border-2 border-dashed border-gray-400 rounded-lg cursor-pointer bg-gray-50 hover:border-blue-500 transition">
                <input id="fileInput" type="file" name="file" accept="image/*" required class="hidden" />
                <span class="text-gray-600 text-center">
                    Drag & Drop image here or <span class="text-blue-600 underline">click to upload</span>
                </span>
            </div>
            <label for="modelSelect" class="block mb-1 font-medium">Choose Model:</label>
            <select name="model_name" id="modelSelect" required class="w-full border-gray-300 rounded p-2">
                <option value="resnet" {% if selected_model=="resnet" %}selected{% endif %}>ResNet</option>
                <!-- <option value="mobilenet" {% if selected_model=="mobilenet" %}selected{% endif %}>MobileNet</option> -->
                <option value="best" {% if selected_model=="best" %}selected{% endif %}>Best</option>
            </select>
            <div class="text-center">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                    Predict
                </button>
            </div>
            <p id="fileName" class="text-sm text-gray-500 text-center mt-2 hidden"></p>
        </form>

        {% if result %}
        <div class="mt-8 flex flex-col items-center">
            <div class="mb-4 text-center">
                <h2 class="text-xl font-semibold text-gray-800">Prediction:</h2>
                <p class="text-lg text-blue-600 mt-1">{{ result }}</p>
            </div>

            {% if image_url %}
            <div class="mt-4">
                <img src="{{ image_url }}" alt="Uploaded Image" class="mx-auto max-h-80 rounded border">
            </div>
            {% endif %}

            <form action="/feedback" method="post">
                <input type="hidden" name="filename" value="{{ filename }}">
                <input type="hidden" name="predicted_label" value="{{ result }}">
                <button name="feedback" value="correct"
                    class="btn bg-green-600 text-white px-4 py-2 rounded">Correct</button>
                <button name="feedback" value="wrong" class="btn bg-red-600 text-white px-4 py-2 rounded">Wrong</button>
            </form>
            <a href="/" class="mt-6 text-blue-600 hover:underline">Scan another image</a>
            {% endif %}
        </div>
        <br />
    </div>
</body>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('border-blue-500', 'bg-blue-50');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('border-blue-500', 'bg-blue-50');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('border-blue-500', 'bg-blue-50');
        fileInput.files = e.dataTransfer.files;
        showFileName();
    });

    fileInput.addEventListener('change', showFileName);

    function showFileName() {
        if (fileInput.files.length > 0) {
            fileNameDisplay.classList.remove('hidden');
            fileNameDisplay.innerText = `📄 ${fileInput.files[0].name} selected.`;
        }
    }

</script>

</html>
